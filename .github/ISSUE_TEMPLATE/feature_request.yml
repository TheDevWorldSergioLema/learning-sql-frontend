name: Idea or new step
description: Suggest a new step, a feature or a better explanation
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What you'd like to add or change.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What it would help students learn or do.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'd like to implement it myself
